<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1076" viewBox="0 0 720 1076" role="img" aria-labelledby="title desc">
  <title id="title">From taste to selection</title>
  <desc id="desc">Trurl reads the taste model and plans a request before researching candidates. Separate seeds can vary eligible weights and research directions. The agent verifies candidates, scores them against the plan and selects for fit and variety. Explicit feedback can update the taste model for the next request.</desc>
  <rect x="1" y="1" width="718" height="1074" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#090909">
    <text x="34" y="46" font-size="15" font-weight="700" letter-spacing="2" fill="#2355C6">HOW TRURL CURATES</text>
    <text x="32" y="94" font-size="47" font-weight="700" letter-spacing="-1.7">From taste to selection</text>
    <text x="34" y="125" font-size="21" fill="#6B6B6B">What carries forward and what changes with each request.</text>

    <g fill="none" stroke="#E6E6E6" stroke-width="1.5">
      <path d="M32 146H688 M94 326H688 M94 465H433 M94 579H688 M94 853H688 M94 949H688"/>
      <path d="M53 184V975"/>
    </g>
    <g fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5">
      <circle cx="53" cy="184" r="18"/>
      <circle cx="53" cy="352" r="18"/>
      <circle cx="53" cy="488" r="18"/>
      <circle cx="53" cy="612" r="18"/>
      <circle cx="53" cy="887" r="18"/>
      <circle cx="53" cy="975" r="18"/>
    </g>
    <g fill="#2355C6" font-size="14" font-weight="700" text-anchor="middle">
      <text x="53" y="189">01</text>
      <text x="53" y="357">02</text>
      <text x="53" y="493">03</text>
      <text x="53" y="617">04</text>
      <text x="53" y="892">05</text>
      <text x="53" y="980">06</text>
    </g>

    <g font-size="28" font-weight="700" letter-spacing="-0.4">
      <text x="94" y="193">Read the taste model</text>
      <text x="94" y="361">Plan this request</text>
      <text x="94" y="497">Find candidates</text>
      <text x="94" y="621">Check and score</text>
      <text x="94" y="896">Make the selection</text>
      <text x="94" y="984">Update the taste model</text>
    </g>

    <g fill="#F7F7F7">
      <rect x="94" y="212" width="273" height="91"/>
      <rect x="400" y="212" width="288" height="91"/>
      <rect x="461" y="365" width="227" height="199"/>
      <rect x="94" y="674" width="594" height="159"/>
    </g>
    <g fill="none" stroke="#2355C6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M35 975H20V184H34" stroke-dasharray="4 4"/>
      <path d="M29 180l5 4-5 4"/>
      <path d="M375 257H392 M387 253l5 4-5 4"/>
      <path d="M461 414H439 M444 410l-5 4 5 4"/>
      <path d="M461 522H439 M444 518l-5 4 5 4"/>
    </g>

    <g fill="#2355C6" font-size="14" font-weight="700" letter-spacing="1.1">
      <text x="110" y="236">YOUR PROFILE AND RECORDS</text>
      <text x="416" y="236">CURATOR’S BRIEF</text>
      <text x="478" y="421">WEIGHT SEED</text>
      <text x="478" y="477">DISCOVERY SEED</text>
      <text x="111" y="703">SIX SCORING DIMENSIONS</text>
    </g>
    <g font-size="21">
      <text x="110" y="263">Interests and familiarity</text>
      <text x="110" y="289">Suggestions and feedback</text>
      <text x="416" y="263">A short, source-linked</text>
      <text x="416" y="289">summary of what’s known</text>
      <text x="94" y="390">Usual weights + today’s request</text>
      <text x="94" y="418">Set the weights and search mix.</text>
      <text x="94" y="526">Research several angles and</text>
      <text x="94" y="552">follow sourced connections.</text>
      <text x="94" y="654">Check sources and request limits. Rule out repeats.</text>
      <text x="94" y="926">Balance fit with variety across topics and creators.</text>
      <text x="94" y="1015">Log the picks and record explicit feedback.</text>
      <text x="94" y="1043">Update the profile when the feedback supports a change.</text>
    </g>
    <text x="94" y="444" font-size="17" fill="#6B6B6B">Format, time and other limits still apply.</text>

    <text x="478" y="394" font-size="22" font-weight="700">Seeded variation</text>
    <text x="478" y="445" font-size="19">Varies eligible weights</text>
    <text x="478" y="501" font-size="19">Varies research angles</text>
    <path d="M478 520H670" fill="none" stroke="#E6E6E6" stroke-width="1.5"/>
    <text x="478" y="543" font-size="15" fill="#6B6B6B">Replay with the same inputs</text>

    <text x="670" y="703" font-size="14" font-weight="700" letter-spacing="0.7" text-anchor="end" fill="#6B6B6B">0–5 RATINGS</text>
    <g font-size="21">
      <text x="111" y="740">Depth</text>
      <text x="272" y="740">Novelty</text>
      <text x="497" y="740">Relevance</text>
      <text x="111" y="773">Surprise</text>
      <text x="272" y="773">Perspective change</text>
      <text x="497" y="773">Entertainment</text>
    </g>
    <path d="M111 790H670" fill="none" stroke="#E6E6E6" stroke-width="1.5"/>
    <text x="111" y="816" font-size="19" font-weight="700">Weighted fit</text>
    <text x="248" y="816" font-size="18" fill="#6B6B6B">Add each rating × its weight for this request</text>
  </g>
</svg>
